name: Check Pages JavaScript

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "spoken-overview-client.js"
      - "public-pages-client.js"
      - "index.html"
      - ".github/workflows/js-syntax-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check app.js syntax
        run: node --check app.js
      - name: Check spoken-overview-client.js syntax
        run: node --check spoken-overview-client.js
      - name: Check public-pages-client.js syntax
        run: node --check public-pages-client.js
